[package]
name = "ome"
version = "0.1.0"
edition = "2021"
description = "Oh My Env：本机 Windows 环境部署管理 CLI（自 ohmypwsh ohmyenv.ps1 剥离的 Rust 实现）"
license = "MIT"

[[bin]]
name = "ome"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml_edit = { version = "0.22", features = ["serde"] }
ureq = { version = "2", features = ["tls"] }
which = "6"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
# assert_cmd 与 predicates 为 clap 官方生态标准 CLI 测试件，只进测试构建
assert_cmd = "2"
predicates = "3"
tempfile = "3"
