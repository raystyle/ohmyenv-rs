[package]
name = "ome"
version = "0.1.0"
edition = "2021"
description = "Oh My Env：全平台 Agent 工具及运行时依赖环境的部署、管理、验收与诊断 CLI"
license = "MIT"

[[bin]]
name = "ome"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order：结构化输出字段序与 kv 行序一致（默认 BTreeMap 会按字母序打乱）
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
toml_edit = { version = "0.22", features = ["serde"] }
ureq = { version = "2", features = ["tls"] }
which = "6"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
# assert_cmd 与 predicates 为 clap 官方生态标准 CLI 测试件，只进测试构建
assert_cmd = "2"
predicates = "3"
tempfile = "3"
