# ffmpeg/ffprobe/ffplay）；Linux BtbN/FFmpeg-Builds n-release 线 GPL 静态（官方 Linux Static
# Builds；单 latest release 含 master/n8.1/n9.0，pattern 钉 n9.0 避免误中旧线）；macOS
# evermeet.cx 仅 Intel 64-bit，ome mac 为 ARM，不设 mac_exe（platform_managed 空态，同 sheldon
