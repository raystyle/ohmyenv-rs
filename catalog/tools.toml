# tools.toml - ome 工具名录唯一 pin 源（46 工具；M0 起数据主权在 ome，psd1 冻结只读）。
# pin 字段（tag/version/asset/sha256 及平台分列）由 ome update / ome pin 回写；sha256 大写，未 pin 时省略。
# 转换器 .tools\import-catalog.ps1 只校验不再生。

# ---- agent 类（D07，2026-09-05 追问链三轮六裁：agent 二进制入册 ome，install 前探 PATH 在位即跳过，
# 存量原地纳管不迁移；数据迁 oma catalog\agents.toml 实证 pin；oma 侧 agents install 同步 deprecated）----

# claude：GitHub release 资产清单 SHASUMS256.txt 校验；资产名不带版本；win zip 解出 claude\ 目录；
# linux 资产名是 x64 不是 x86_64（M014 同型，ohmyenv-rs#10 实证）
[tools.claude]
desc = "终端智能体 Claude Code（claude 交互会话、claude -p 非交互）"
guide_dirs = ["%USERPROFILE%\\.claude"]
guide_notes = """
升级走 claude 自身更新；ome install 对 PATH 在位的 agent 跳过（--force 才装进 EnvRoot）
配置、hook 与凭据归 ohmyagents 域，ome 只管二进制
"""
probe_pattern = '^(\d+\.\d+\.\d+)'
category = "agent"
deploy = "official"
dir = "claude"
bin = "claude"
exe = 'claude\claude.exe'
extract = "zip"
repo = "anthropics/claude-code"
tag_prefix = "v"
asset_pattern = '^claude-win32-x64\.zip$'
sums_asset = "SHASUMS256.txt"
sums_pattern = 'claude-win32-x64\.zip'
linux_asset_pattern = '^claude-linux-x64\.tar\.gz$'
linux_dir = "~/.local/bin"
linux_bin = "~/.local/bin"
linux_exe = "claude"
linux_extract = "targz"
linux_sums_pattern = 'claude-linux-x64\.tar\.gz'
mac_asset_pattern = '^claude-darwin-arm64\.tar\.gz$'
mac_dir = "~/.local/bin"
mac_bin = "~/.local/bin"
mac_exe = "claude"
mac_extract = "targz"
mac_sums_pattern = 'claude-darwin-arm64\.tar\.gz'
tag = "v2.1.251"
version = "2.1.251"
asset = "claude-win32-x64.zip"
sha256 = "22E6A1EE55A866750B5A842912EA1D8A90644868456062CA2A31BCCC379C960A"
linux_tag = "v2.1.251"
linux_version = "2.1.251"
linux_asset = "claude-linux-x64.tar.gz"
linux_sha256 = "4FDA59F47AB17C0E0C831B3144E3025C050397BA37D574388F52E92E1AF81C74"
