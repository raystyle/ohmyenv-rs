# ome 自管条目（操作编排依赖组首）：无 pin 无资产（self update 三通道 dev/stable/git 按资产
# sha 滚动，非版本 pin 语义）；探测位为 init 自部署目标（Windows 用户程序目录 / POSIX ~/.local/bin）；
# install/update/pin 均 evergreen 式跳过并提示 `ome self update`。oma 同组待 ohmyagents 侧
# 集成（--version 支持与发布通道裁决，见 issue）；omcf 属运行时衍生依赖组待 ohmycloud 侧就绪。
[tools.ome]
desc = "本环境管理器自身：doctor/install/status 三原语的部署管理 CLI"
guide_env = ["OHMYENV_ROOT", "OME_MIRROR"]
guide_dirs = ["%LOCALAPPDATA%\\Programs\\ome", "%LOCALAPPDATA%\\ohmyenv"]
guide_notes = """
升级走 ome self update（dev/stable/git 三通道；官方失败回落镜像边车，OME_MIRROR=1 镜像优先）
数据目录（catalog 副本与 SKILL.md）在 %LOCALAPPDATA%\\ohmyenv；EnvRoot 默认 D:\\ohmyenv（win）、~/.local/share/ohmyenv（POSIX）
"""
probe_pattern = 'ome (\d+\.\d+\.\d+)'
category = "base"
deploy = "installer"
dir = "ome"
exe = '%LOCALAPPDATA%\Programs\ome\ome.exe'
extract = "ome-self"
linux_dir = "~/.local/bin"
linux_bin = "~/.local/bin"
linux_exe = "ome"
mac_dir = "~/.local/bin"
mac_bin = "~/.local/bin"
mac_exe = "ome"

[tools.herdr]
desc = "终端 workspace/tab/pane 多路复用器，多 agent 并行会话的宿主"
guide_dirs = ["%APPDATA%\\herdr"]
guide_notes = """
服务器为常驻进程：升级后须面板外重启才换二进制（运行中 exe 锁定）
socket、配置与日志在 %APPDATA%\\herdr；conpty 运行态在装位目录内
"""
probe_pattern = '^herdr\s+v?(\d+\.\d+\.\d+)'
category = "base"
deploy = "envroot"
dir = "herdr"
bin = "herdr"
exe = 'herdr\herdr.exe'
