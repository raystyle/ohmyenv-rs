# rclone：云存储同步 CLI（ohmycloud#9 请求入册：env-seed 上传链切 R2 S3 直传提效，2026-09-08）。
# 官方 rclone/rclone release 带 SHA256SUMS 统一清单（sums_asset 三平台分列取行）；
# win zip 展平单根目录（rclone.exe 直落 dir）；linux/mac zip 带版本子目录，zip-bin 取单二进制落 ~/.local/bin。
[tools.rclone]
desc = "云存储同步 CLI（R2/S3 直传、本地挂载）"
guide_env = ["RCLONE_CONFIG"]
guide_dirs = ["%USERPROFILE%\\.config\\rclone"]
guide_notes = """
