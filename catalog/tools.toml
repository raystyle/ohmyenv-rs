linux_asset_pattern = '^powershell-[0-9.]+-linux-x64\.tar\.gz$'
linux_dir = "~/.local/share/powershell/7"
linux_bin = "~/.local/share/powershell/7"
linux_exe = "pwsh"
linux_extract = "targz"
linux_sums_pattern = "powershell-[0-9.]+-"
linux_tag = "v7.6.5"
linux_version = "7.6.5"
