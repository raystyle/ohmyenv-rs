# tools.toml - ome 工具名录唯一 pin 源
# 托管 26 节由 .tools\import-catalog.ps1 从 ohmypwsh scripts\catalog.psd1（Win 侧）与 helpers.ps1 New-ToolDef 自动生成，勿手改。
# 托管之外的本地新增工具节（如 reader）重跑转换时原样保留在尾部。
# pin 字段（tag/version/asset/sha256）由 ome update / ome pin 回写；sha256 大写，未 pin 时省略。

[tools.pwsh]
category = "agent"
deploy = "installer"
dir = "pwsh"
exe = '%ProgramFiles%\PowerShell\7\pwsh.exe'
extract = "msi"
repo = "PowerShell/PowerShell"
tag_prefix = "v"
asset_pattern = '^PowerShell-[0-9.]+-win-x64\.msi$'
sums_asset = "hashes.sha256"
sums_pattern = 'PowerShell-[0-9.]+-win-x64\.msi'
tag = "v7.6.5"
version = "7.6.5"
asset = "PowerShell-7.6.5-win-x64.msi"

