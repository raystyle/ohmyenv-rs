# 本地新增（2026-09-01）：VS Build Tools 接管（自 ohmypwsh scripts\set-vsbuild.ps1 平移）。
# evergreen 引导器：无 tag/version/sha256 可 pin（aka.ms 永续直链）；install 幂等，
# 未提权且 gsudo 在位时自动提权；PATH 写机器级（MSBuild 与 cl 目录）；版本探测走 exe。
# Windows SDK 不随 VS 组件（ISO 分离装 Windows Kits，暂留 ohmypwsh set-windows-sdk.ps1）。
[tools.vsbuild]
category = "base"
deploy = "envroot"
dir = "vsbuild"
exe = 'vsbuild\MSBuild\Current\Bin\MSBuild.exe'
extract = "vsbuild"
cdn_url = "https://aka.ms/vs/17/release/vs_buildtools.exe"


