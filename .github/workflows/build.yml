# ome 三平台构建与双通道发布：
# - push main：构建测试后资产滚动挂 pre-release tag `dev`（本地测试期的滚动升级源，`ome self update`）；
# - push v* tag：构建测试后资产挂正式 release（封版触发，`ome self update --stable`）。
# 资产名即编译目标（selfupdate 按目标三元组映射）；mac 只要 arm64 不要 intel（用户裁决）。
name: build

on:
  push:
    branches:
      - main
    # docs-only 不触发构建与镜像灌段（win 构建非确定性白滚、路线 A 空转；2026-09-08 用户裁）。
    # tag 推送不受 paths 过滤，v* 封版永远构建。workflow_dispatch 手动不受限。
    paths:
      - 'src/**'
      - 'tests/**'
      - 'catalog/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stable_tag:
        description: '手动补推 ome/stable 的 v* tag（留空走 ome/dev 沙滚）'
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # bin 随 crate 名（D41 A）；asset 主名 ark-* 加 compat 兼容名 ome-* 同内容双附
          # （D41 B：旧二进制认 ome-*，存量机水位清零后撤 compat）
          - os: windows-latest
            bin: ark.exe
            asset: ark-x86_64-pc-windows-msvc.exe
            compat: ome-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            bin: ark
            asset: ark-x86_64-unknown-linux-gnu
            compat: ome-x86_64-unknown-linux-gnu
            apt: liblzma-dev
          - os: macos-latest
            bin: ark
            asset: ark-aarch64-apple-darwin
            compat: ome-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: 装系统依赖
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: 构建
        run: cargo build --release --locked
      - name: 测试
        run: cargo test --release --locked
        env:
          # 真网测试（query latest / jq 安装闭环）打 api.github.com：匿名共享 IP 限流 60 次/时，
          # 认证后 5000+（resolve.rs 读 GH_TOKEN 注入 Bearer，gh api 兜底同认它）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 文档门禁
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv run --script .tools/mdcharlint.py .
          uv run --script .tools/md-ref-scan.py
          uv run --script .tools/md-heading-scan.py
      - name: 归位资产名（主名与兼容名双附同内容）
        shell: bash
        run: |
          cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
          cp "target/release/${{ matrix.bin }}" "${{ matrix.compat }}"
      - name: 发布资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset }}
          COMPAT: ${{ matrix.compat }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 正式版：tag 已存在，release 不在则建（正式 release 非 prerelease）
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                   --title "$GITHUB_REF_NAME" --verify-tag
            gh release upload "$GITHUB_REF_NAME" "$ASSET" "$COMPAT" --repo "$GITHUB_REPOSITORY" --clobber
          else
            # dev 滚动源：tag dev 不存在则从 main 建 prerelease
            gh release view dev --repo "$GITHUB_REPOSITORY" \
              || gh release create dev --repo "$GITHUB_REPOSITORY" \
                   --title dev --prerelease --target main
            gh release upload dev "$ASSET" "$COMPAT" --repo "$GITHUB_REPOSITORY" --clobber
          fi

  mirror-r2:
    # D27/D41 路线 A：产物灌 R2 段（oma 同型，段名与 self update 通道同名）。D41 B 双写：
    # push main 推 ark/dev 加 ome/dev 双段；push v* tag 或 dispatch 补双 stable 段。
    # ark/ 段配 ark-* 主名、ome/ 段配 ome-* 兼容名（同一 job 两族各跑一次 seed.py，同内容）；
    # 停 ome/ 段与撤 ome-* 资产名判据同为存量机水位清零。资产过锚（本地 sha 自算）后
    # rclone 上传，NO_CHECK_BUCKET 必带（受限 token 无建桶权）。
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 装 rclone 与 uv 兜底（rclone pin v1.75.1，sha 锚即 catalog linux pin）
        run: |
          curl -fL -o rclone.zip https://github.com/rclone/rclone/releases/download/v1.75.1/rclone-v1.75.1-linux-amd64.zip
          echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  rclone.zip" | sha256sum -c -
          sudo unzip -j rclone.zip 'rclone-v1.75.1-linux-amd64/rclone' -d /usr/local/bin
          command -v rclone && rclone version | head -1
          command -v uv || { curl -LsSf https://astral.sh/uv/install.sh | sh; echo "$HOME/.local/bin" >> "$GITHUB_PATH"; }
          command -v uv || { echo uv 安装失败; exit 1; }
      - name: 灌段双写（main 推 ark/dev 加 ome/dev；v* tag 或 dispatch 补双 stable 段）
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            uv run --script .tools/seed.py --ark-stable --tag "$GITHUB_REF_NAME" && \
            uv run --script .tools/seed.py --ome-stable --tag "$GITHUB_REF_NAME"
          elif [[ -n "${{ github.event.inputs.stable_tag }}" ]]; then
            uv run --script .tools/seed.py --ark-stable --tag "${{ github.event.inputs.stable_tag }}" && \
            uv run --script .tools/seed.py --ome-stable --tag "${{ github.event.inputs.stable_tag }}"
          else
            uv run --script .tools/seed.py --ark-dev --tag dev && \
            uv run --script .tools/seed.py --ome-dev --tag dev
          fi
